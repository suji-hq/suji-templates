slug: ghost

name: Ghost
description: Modern publishing platform for blogs, newsletters, and membership sites.
homepage_url: https://ghost.org
icon_url: https://raw.githubusercontent.com/suji-hq/suji-templates/main/ghost/icon.svg
version: 6.63.0
release_notes: >-
  Update Ghost to 6.63.0 (from 6.62.0). Only the pinned image version
  changed: the install form, exposed port, and storage are the same,
  so existing installs keep their settings and data. See the upstream
  release notes for what changed inside the app.
categories: [cms, productivity]
license: MIT

resources:
  min_memory_mib: 512
  recommended_memory_mib: 1024
  min_cpu_millicores: 250
  recommended_storage_gib: 5

exposure:
  exposable: true
  default: on
  port: 2368
  subdomain_hint: ghost

network:
  internal_hostname: ghost

upgrade_policy: manual

registry:
  - docker.io

form_schema: []
