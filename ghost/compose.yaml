services:
  ghost:
    image: docker.io/ghost:6.62.0
    restart: unless-stopped
    environment:
      url: ${SUJI_PUBLIC_URL}
      database__client: sqlite3
      database__connection__filename: /var/lib/ghost/content/data/ghost.db
      # Ghost emails a one-time code on every login after the very first one.
      # This template configures no SMTP, so leaving the default (true) locks
      # the owner out of /ghost/ on their second sign-in. Off keeps the normal
      # email + password login working.
      security__staffDeviceVerification: "false"
    ports:
      - "2368"
    volumes:
      - ghost-content:/var/lib/ghost/content
    networks: [suji-net]
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"
volumes:
  ghost-content:
networks:
  suji-net:
    external: true
