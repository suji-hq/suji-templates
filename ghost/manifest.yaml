slug: ghost

name: Ghost
description: Modern publishing platform for blogs, newsletters, and membership sites.
homepage_url: https://ghost.org
icon_url: https://raw.githubusercontent.com/suji-hq/suji-templates/main/ghost/icon.svg
version: 6.62.0
release_notes: >-
  Update Ghost to 6.62.0 (from 6.59.0) and fix owner sign-in. This release
  closes five upstream security advisories that affect 6.59.0, including a
  critical one that let a suspended staff account reactivate itself through
  the password-reset flow, and a high-severity unauthenticated checkout issue.
  Separately, staff device verification is now turned off: Ghost emails a
  one-time code on every login after the first, and because this template
  configures no mail server that code could never arrive, which locked owners
  out of Ghost Admin on their second sign-in. Email and password login now
  works normally. No install-form, port, or volume changes; Ghost runs its own
  database migrations on first boot.
categories: [cms, productivity]
license: MIT

resources:
  min_memory_mib: 512
  recommended_memory_mib: 1024
  min_cpu_millicores: 250
  recommended_storage_gib: 5

exposure:
  exposable: true
  default: on
  port: 2368
  subdomain_hint: ghost

network:
  internal_hostname: ghost

upgrade_policy: manual

registry:
  - docker.io

form_schema: []
