name: hermes security image
on:
  pull_request:
    paths: ['images/hermes/**', '.github/workflows/hermes-security-image.yml']
  push:
    branches: [main]
    paths: ['images/hermes/**', '.github/workflows/hermes-security-image.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hermes-security-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: docker build -t marketplace-hermes:test images/hermes
      - name: Verify runtime as the final application user
        run: docker run --rm --network none --user 10000:10000 -i --entrypoint /opt/hermes/.venv/bin/python marketplace-hermes:test < images/hermes/verify.py
      - name: Verify hash rejection and actual non-root PM repair from pinned downloads
        run: |
          docker run --rm --memory 1536m --cpus 1 \
            --tmpfs /tmp/repair-home:rw,exec,size=768m \
            -e HERMES_HOME=/tmp/repair-home -i \
            --entrypoint /opt/hermes/.venv/bin/python marketplace-hermes:test < images/hermes/repair-test.py
      - name: Verify authentication and persistent state without provider credentials
        env:
          MARKETPLACE_SMOKE_IMAGE: marketplace-hermes:test
        run: |
          python3 -m venv /tmp/suji-image-smoke
          /tmp/suji-image-smoke/bin/pip install PyYAML==6.0.3
          /tmp/suji-image-smoke/bin/python images/hermes/smoke.py
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'suji-hq/suji-templates'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Refuse an existing release tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          for page in range(1, 101):
              url = f'https://api.github.com/orgs/suji-hq/packages/container/marketplace-hermes/versions?per_page=100&page={page}'
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as response: versions = json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404 and page == 1: break
                  raise
              if any('0.22.4-suji.1' in v.get('metadata', {}).get('container', {}).get('tags', []) for v in versions):
                  raise RuntimeError('Release tag already exists; choose a new version')
              if len(versions) < 100: break
          else: raise RuntimeError('Package pagination exceeded bound')
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish exact reviewed source
        run: |
          docker buildx build --platform linux/amd64 --push \
            --tag ghcr.io/suji-hq/marketplace-hermes:0.22.4-suji.1 \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --metadata-file image-metadata.json images/hermes
          python3 - <<'PY'
          import json, re
          d=json.load(open('image-metadata.json'))['containerimage.digest']
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', d): raise RuntimeError('Invalid pushed manifest digest')
          print('Published digest: ' + d)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-image-metadata
          path: image-metadata.json
