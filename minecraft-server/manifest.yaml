slug: minecraft-server
name: Minecraft Server
description: >-
  Self-hosted Minecraft Java server managed by the Crafty Controller web
  panel. Create and run servers, edit configs, schedule backups, and use the
  in-browser console. The first server (port 25565) is reachable by players at
  your VM's public IP; the admin panel is at your suji.fr subdomain. Sign in as
  "admin" with the password in app/config/default-creds.txt in this app's
  storage, then change it and delete the file.
homepage_url: https://craftycontrol.com
icon_url: https://raw.githubusercontent.com/suji-hq/suji-templates/main/minecraft-server/icon.svg
version: 4.10.8
release_notes: >-
  Update Crafty Controller to 4.10.8 (from 4.10.7). This release fixes
  CVE-2026-13716, a critical path-traversal flaw in the upload handler that
  let a signed-in user write files to arbitrary paths on the server. It also
  fixes Bedrock updates, directory downloads in the file manager, and backup
  exclusions, and adds a Run Now button for scheduled tasks. Separately, this
  template's description now points to the right place for the initial admin
  password: Crafty writes it to app/config/default-creds.txt and has never
  printed it to the app logs. No port, storage, or install-form changes.
categories: [gaming]
license: GPL-3.0-only
resources:
  min_memory_mib: 4096
  recommended_memory_mib: 6144
  min_cpu_millicores: 1000
  recommended_storage_gib: 40
exposure:
  exposable: true
  default: on
  port: 8443
  subdomain_hint: minecraft
  scheme: https
tcp_ports: [25565]
network:
  internal_hostname: minecraft
upgrade_policy: manual
registry:
  - docker.io
# No platform-level config form: all Minecraft/server settings live in the
# Crafty Controller admin panel (the app's subdomain). TZ is pinned in the
# compose. Keeping form_schema empty avoids a near-useless one-field form.
form_schema: []
