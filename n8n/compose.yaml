services:
  n8n:
    image: ghcr.io/suji-hq/marketplace-n8n:2.44.6-suji.1
    restart: unless-stopped
    environment:
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
    ports:
      - "5678"
    volumes:
      - n8n-data:/home/node/.n8n
    networks: [suji-net]
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"
volumes:
  n8n-data:
networks:
  suji-net:
    external: true
