name: nocodb security image
on:
  pull_request:
    paths: ['images/nocodb/**', '.github/workflows/nocodb-security-image.yml']
  push:
    branches: [main]
    paths: ['images/nocodb/**', '.github/workflows/nocodb-security-image.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nocodb-security-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: docker build -t marketplace-nocodb:test images/nocodb
      - name: Verify actual runtime and all patched packages and native modules
        run: docker run --rm --network none --read-only -i --entrypoint node marketplace-nocodb:test < images/nocodb/verify.cjs
      - name: Verify auth, record CRUD and persistent storage
        run: python3 images/nocodb/smoke.py marketplace-nocodb:test
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'suji-hq/suji-templates'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Refuse an existing release tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          for page in range(1, 101):
              url = f'https://api.github.com/orgs/suji-hq/packages/container/marketplace-nocodb/versions?per_page=100&page={page}'
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as response: versions = json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404 and page == 1: break
                  raise
              if any('2026.09.1-suji.1' in v.get('metadata', {}).get('container', {}).get('tags', []) for v in versions):
                  raise RuntimeError('Release tag already exists; choose a new version')
              if len(versions) < 100: break
          else: raise RuntimeError('Package pagination exceeded bound')
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish exact reviewed source
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --tag ghcr.io/suji-hq/marketplace-nocodb:2026.09.1-suji.1 \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --metadata-file image-metadata.json images/nocodb
          python3 - <<'PY'
          import json, re
          d=json.load(open('image-metadata.json'))['containerimage.digest']
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', d): raise RuntimeError('Invalid pushed manifest digest')
          print('Published digest: ' + d)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nocodb-image-metadata
          path: image-metadata.json
