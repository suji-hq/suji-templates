slug: nocodb

name: NocoDB
description: Open-source Airtable alternative that turns any database into a smart spreadsheet UI.
homepage_url: https://nocodb.com
icon_url: https://raw.githubusercontent.com/suji-hq/suji-templates/main/nocodb/icon.svg
version: 2026.09.0
release_notes: >-
  Update NocoDB to 2026.09.0 (from 2026.08.2). Only the pinned image version
  changed: the install form, exposed port, and storage are the same,
  so existing installs keep their settings and data. See the upstream
  release notes for what changed inside the app.
categories: [database, productivity]
license: AGPL-3.0

resources:
  min_memory_mib: 1024
  recommended_memory_mib: 2048
  min_cpu_millicores: 250
  recommended_storage_gib: 5

exposure:
  exposable: true
  default: on
  port: 8080
  subdomain_hint: nocodb

network:
  internal_hostname: nocodb

upgrade_policy: manual

registry:
  - docker.io

form_schema:
  - key: NC_AUTH_JWT_SECRET
    type: secret
    label: JWT secret
    description: Auto-generated if blank.
    auto_generate: true
